<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Sessions - Amplimentor</title>
    <!-- Simple loading screen styled beautifully -->
    <style>
        body {
            background-color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #0F172A;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #EFF6FF;
            border-top: 4px solid #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }
    </style>
    <script src="/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(API_BASE + '/api/profile', { credentials: 'include' });
                if (response.ok) {
                    const user = await response.json();
                    if (user.role === 'mentor') {
                        window.location.replace('/mentor-sessions.html');
                    } else {
                        window.location.replace('/student-sessions.html');
                    }
                } else {
                    const saved = localStorage.getItem('simulatedRole') || 'student';
                    window.location.replace(saved === 'mentor' ? '/mentor-sessions.html' : '/student-sessions.html');
                }
            } catch (err) {
                console.error('Error in session redirect:', err);
                const saved = localStorage.getItem('simulatedRole') || 'student';
                window.location.replace(saved === 'mentor' ? '/mentor-sessions.html' : '/student-sessions.html');
            }
        });
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Loading sessions dashboard...</h2>
    </div>
</body>
</html>
