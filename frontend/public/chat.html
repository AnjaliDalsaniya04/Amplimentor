<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing Messages...</title>
    <script src="/config.js"></script>
</head>
<body>
    <div style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #F8FAFC; color: #4B5563;">
        <div style="text-align: center;">
            <div style="border: 4px solid #E2E8F0; border-top: 4px solid #4F7DF7; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
            <p style="font-weight: 600; font-size: 14px; margin: 0;">Opening your messages...</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(API_BASE + '/api/profile', { credentials: 'include' });
                if (response.ok) {
                    const profile = await response.json();
                    if (profile.role === 'mentor') {
                        window.location.replace('/mentor-chat.html');
                    } else {
                        window.location.replace('/student-chat.html');
                    }
                } else {
                    const saved = localStorage.getItem('simulatedRole') || 'student';
                    window.location.replace(saved === 'mentor' ? '/mentor-chat.html' : '/student-chat.html');
                }
            } catch (err) {
                console.error(err);
                const saved = localStorage.getItem('simulatedRole') || 'student';
                window.location.replace(saved === 'mentor' ? '/mentor-chat.html' : '/student-chat.html');
            }
        });
    </script>
</body>
</html>
