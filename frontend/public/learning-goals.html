<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Goals - Amplimentor</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Platform base styles -->
    <link rel="stylesheet" href="/style.css?v=1.2">
    <script src="/config.js"></script>
    <script src="/toast-manager.js"></script>
    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Specificity updates for navbar profile dropdown */
        .profile-dropdown-wrapper {
            position: relative;
            display: inline-block;
        }
        .nav-menu a.profile-dropdown-trigger {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            cursor: pointer !important;
            padding: 4px 8px !important;
            border-radius: 8px !important;
            color: var(--text-secondary) !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            text-decoration: none !important;
            line-height: 1 !important;
            height: 32px !important;
            box-sizing: border-box !important;
        }
        .nav-avatar-container {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1.5px solid var(--border-color);
            flex-shrink: 0;
        }
        .nav-avatar-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            margin-top: 3px;
        }
        .profile-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            min-width: 160px;
            margin-top: 4px;
            padding: 4px 0;
        }
        .profile-dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: var(--text-secondary) !important;
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
        }
        .profile-dropdown-menu a:hover {
            background-color: #F1F5F9;
            color: var(--primary) !important;
        }
        .profile-dropdown-wrapper.open .profile-dropdown-menu {
            display: block;
        }

        /* Layout panels */
        .goals-workspace-grid {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(320px, 380px);
            gap: 24px;
        }

        .goal-row-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(15,23,42,0.01);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .goal-row-card:hover {
            border-color: var(--primary);
        }
        .goal-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .goal-title-lbl {
            font-size: 16px;
            font-weight: 800;
            color: #0F172A;
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* Progress Bar style */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-inner {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        /* Milestones checklist */
        .milestone-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #F1F5F9;
            font-size: 13.5px;
            color: #334155;
            cursor: pointer;
        }
        .milestone-item-row:last-child {
            border-bottom: none;
        }

        /* Sidebar uploader/forms */
        .sidebar-goal-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            align-self: start;
        }
        .form-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748B;
            margin-bottom: 6px;
            display: block;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            margin-bottom: 14px;
        }
        .btn-goal-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13.5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Top Nav bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/student-dashboard.html" class="nav-brand" id="brandLink">Amplimentor Hub</a>
            <ul class="nav-menu">
                <li id="dynamicNavLink"><a href="/student/mentors">Find Mentors</a></li>
                <li><a href="/chat.html">Messages</a></li>
                <li><a href="/sessions.html">Sessions</a></li>
                <li class="profile-dropdown-wrapper" id="profileDropdownWrapper">
                    <a href="#" class="profile-dropdown-trigger" onclick="toggleProfileDropdown(event)">
                        <div class="nav-avatar-container">
                            <img src="/default-avatar.png" id="navAvatar" class="nav-avatar-img">
                        </div>
                        <span id="navName">Profile</span> <i class="fa-solid fa-chevron-down" style="font-size:10px; margin-left:4px;"></i>
                    </a>
                    <div class="profile-dropdown-menu" id="dropdownMenu">
                        <!-- Filled by JS -->
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Workspace framework -->
    <div class="goals-workspace-grid">
        
        <!-- Left: Goals lists -->
        <main class="goals-list-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <h1 style="font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0;">Target Learning Goals</h1>
                <span style="font-size:13px; font-weight:700; color:#64748B;">Showing active milestones</span>
            </div>

            <!-- List box container -->
            <div id="goalsContainer">
                <!-- Loaded dynamically by JS -->
            </div>
        </main>

        <!-- Right: Create form sidebar -->
        <aside class="sidebar-goal-card" id="goalSidebar">
            <!-- Loaded dynamically by JS -->
        </aside>
    </div>

    <script>
        let currentRole = 'student';
        let goals = [];

        function toggleProfileDropdown(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('profileDropdownWrapper').classList.toggle('open');
        }
        document.addEventListener('click', () => {
            const wrap = document.getElementById('profileDropdownWrapper');
            if (wrap) wrap.classList.remove('open');
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(API_BASE + '/api/profile', { credentials: 'include' });
                if (response.ok) {
                    const profile = await response.json();
                    currentRole = profile.role;

                    const brand = document.getElementById('brandLink');
                    const dynLink = document.getElementById('dynamicNavLink');
                    const dropdown = document.getElementById('dropdownMenu');
                    document.getElementById('navName').textContent = profile.name;

                    if (profile.photo) {
                        document.getElementById('navAvatar').src = API_BASE + '/uploads/' + profile.photo;
                    }

                    if (currentRole === 'mentor') {
                        brand.href = '/mentor-dashboard.html';
                        brand.textContent = 'Amplimentor Workspace';
                        dynLink.innerHTML = '<a href="/my-students.html">My Students</a>';
                        dropdown.innerHTML = `
                            <a href="/mentor/profile"><i class="fa-solid fa-user"></i> My Profile</a>
                            <a href="/mentor/settings"><i class="fa-solid fa-gear"></i> Settings</a>
                            <a href="/logout" class="logout-btn" style="color:var(--danger) !important;"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
                        `;
                    } else {
                        brand.href = '/student-dashboard.html';
                        brand.textContent = 'Amplimentor Learning Hub';
                        dynLink.innerHTML = '<a href="/student/mentors">Find Mentors</a>';
                        dropdown.innerHTML = `
                            <a href="/student/profile"><i class="fa-solid fa-user"></i> My Profile</a>
                            <a href="/student-settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
                            <a href="/logout" class="logout-btn" style="color:var(--danger) !important;"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
                        `;
                    }

                    seedMockGoals();
                } else {
                    seedMockGoals();
                }
            } catch (err) {
                console.error(err);
                seedMockGoals();
            }
        });

        function seedMockGoals() {
            goals = [
                {
                    id: 'g-1',
                    title: 'Prepare Botany genetics chapters (Target: NEET 2026)',
                    targetDate: 'July 25, 2026',
                    mentorSuggestions: 'Complete Punnett worksheets first, then review dihybrid cross mechanisms.',
                    milestones: [
                        { id: 'm-1-1', text: 'Study Mendelian Laws chapter NCERT', completed: true },
                        { id: 'm-1-2', text: 'Solve 2 Genetics worksheets homework', completed: true },
                        { id: 'm-1-3', text: 'Take Genetics online practice quiz test', completed: false }
                    ]
                },
                {
                    id: 'g-2',
                    title: 'Gauss Law electric flux revision concepts',
                    targetDate: 'July 15, 2026',
                    mentorSuggestions: 'Draw sphere surface boundary lines inside hollow sheets.',
                    milestones: [
                        { id: 'm-2-1', text: 'Derive Gauss law formula', completed: true },
                        { id: 'm-2-2', text: 'Complete 5 derivations practices', completed: false }
                    ]
                }
            ];

            renderGoalsList();
            renderSidebarGoalForm();
        }

        function renderGoalsList() {
            const container = document.getElementById('goalsContainer');
            container.innerHTML = '';

            goals.forEach(goal => {
                const total = goal.milestones.length;
                const completedCount = goal.milestones.filter(m => m.completed).length;
                const progressPercent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

                container.innerHTML += `
                    <div class="goal-row-card">
                        <div class="goal-header-flex">
                            <div>
                                <h3 class="goal-title-lbl">${goal.title}</h3>
                                <span style="font-size:11.5px; color:#64748B; margin-top:4px; display:inline-block;"><i class="fa-solid fa-calendar"></i> Target Date: ${goal.targetDate}</span>
                            </div>
                            <span style="font-size:15px; font-weight:800; color:var(--primary);">${progressPercent}% Completed</span>
                        </div>

                        <!-- Progress Bar -->
                        <div class="progress-bar-container">
                            <div class="progress-bar-inner" style="width: ${progressPercent}%;"></div>
                        </div>

                        <!-- Milestones checklist -->
                        <div style="margin-top:20px; display:flex; flex-direction:column;">
                            <span class="form-label" style="margin-bottom:8px;">Milestones checklist</span>
                            ${goal.milestones.map(m => {
                                const checkIcon = m.completed ? 'fa-solid fa-square-check' : 'fa-regular fa-square';
                                const checkColor = m.completed ? 'color:var(--primary); font-weight:800;' : 'color:#94A3B8;';
                                return `
                                    <div class="milestone-item-row" onclick="toggleMilestone('${goal.id}', '${m.id}')">
                                        <i class="${checkIcon}" style="font-size:16px; ${checkColor}"></i>
                                        <span style="${m.completed ? 'text-decoration:line-through; color:#94A3B8;' : ''}">${m.text}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${currentRole === 'student' ? `
                            <div style="display:flex; gap:8px; margin-top:12px; max-width: 340px;">
                                <input type="text" placeholder="Add custom milestone..." class="form-input" style="font-size:12px; height:34px; padding:0 10px; margin:0;" id="inlineNewM-${goal.id}">
                                <button class="btn-goal-primary" style="font-size:12px; height:34px; width:auto; padding:0 12px; margin:0;" onclick="addInlineMilestone('${goal.id}')">Add</button>
                            </div>
                        ` : ''}

                        <!-- Mentor suggestion tag -->
                        ${goal.mentorSuggestions ? `
                            <div style="margin-top:16px; background-color:#EFF6FF; border-left:3px solid var(--primary); padding:10px; border-radius:4px; font-size:12px; color:#1E40AF;">
                                <strong>Mentor Tip:</strong> ${goal.mentorSuggestions}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function renderSidebarGoalForm() {
            const sidebar = document.getElementById('goalSidebar');

            if (currentRole === 'student') {
                sidebar.innerHTML = `
                    <h3 style="font-size:15px; font-weight:800; color:#0F172A; margin:0 0 16px 0;">Create Study Goal</h3>
                    
                    <label class="form-label">Goal Title</label>
                    <input type="text" placeholder="Genetics dihybrid revisions" class="form-input" id="newGoalTitle">

                    <label class="form-label">Target Date</label>
                    <input type="text" placeholder="July 28, 2026" class="form-input" id="newGoalDate">

                    <label class="form-label">Milestone 1</label>
                    <input type="text" placeholder="NCERT textbook chapter review" class="form-input" id="newMilestone1">

                    <label class="form-label">Milestone 2</label>
                    <input type="text" placeholder="genetics worksheets homework solutions" class="form-input" id="newMilestone2">

                    <button class="btn-goal-primary" onclick="createGoal()">Add Target Goal</button>

                    <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
                        <h4 class="form-label" style="color:var(--primary); font-size:12.5px;"><i class="fa-solid fa-wand-magic-sparkles"></i> Recommended Milestones</h4>
                        <div style="font-size:12px; display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                            <div style="border:1px dashed #CBD5E1; padding:8px; border-radius:6px; cursor:pointer;" onclick="quickAddSuggestedMilestone('Review Mendel 3 Laws NCERT')">+ Review Mendel 3 Laws NCERT</div>
                            <div style="border:1px dashed #CBD5E1; padding:8px; border-radius:6px; cursor:pointer;" onclick="quickAddSuggestedMilestone('Solve 10 genetics crosses math')">+ Solve 10 genetics crosses math</div>
                            <div style="border:1px dashed #CBD5E1; padding:8px; border-radius:6px; cursor:pointer;" onclick="quickAddSuggestedMilestone('Take practice genetics online quiz')">+ Take practice genetics online quiz</div>
                        </div>
                    </div>
                `;
            } else {
                sidebar.innerHTML = `
                    <h3 style="font-size:15px; font-weight:800; color:#0F172A; margin:0 0 16px 0;">Mentor Suggestions</h3>
                    <p style="font-size:12.5px; color:#64748B; line-height:1.5; margin-bottom:16px;">Suggest study goals and milestones for your students to guide their learning path.</p>
                    
                    <label class="form-label">Add Tip for genetics goal</label>
                    <textarea class="form-input" placeholder="Complete dihybrid cross Punnett worksheet..." style="height:80px; resize:none;" id="mentorTipArea"></textarea>
 
                    <button class="btn-goal-primary" onclick="publishMentorTip()">Add Learning Tip</button>
                `;
            }
        }

        // Student goal creation
        function createGoal() {
            const title = document.getElementById('newGoalTitle').value;
            const date = document.getElementById('newGoalDate').value;
            const m1 = document.getElementById('newMilestone1').value;
            const m2 = document.getElementById('newMilestone2').value;

            if (!title || !m1) {
                window.toast.warning("Inputs missing", "Please fill goal title and at least one milestone.");
                return;
            }

            const newGoal = {
                id: `g-${Date.now()}`,
                title,
                targetDate: date || 'Next month',
                mentorSuggestions: '',
                milestones: [
                    { id: `m-${Date.now()}-1`, text: m1, completed: false }
                ]
            };

            if (m2.trim() !== '') {
                newGoal.milestones.push({ id: `m-${Date.now()}-2`, text: m2, completed: false });
            }

            goals.push(newGoal);

            document.getElementById('newGoalTitle').value = '';
            document.getElementById('newGoalDate').value = '';
            document.getElementById('newMilestone1').value = '';
            document.getElementById('newMilestone2').value = '';

            window.toast.success("Goal Created", "New learning target added!");
            renderGoalsList();
        }

        // Mentor feedback tip
        function publishMentorTip() {
            const tip = document.getElementById('mentorTipArea').value;
            if (tip.trim() === '') return;

            if (goals.length > 0) {
                goals[0].mentorSuggestions = tip;
                window.toast.success("Tip Shared", "Feedback note shared with student.");
                document.getElementById('mentorTipArea').value = '';
                renderGoalsList();
            }
        }

        // Check off milestones
        function toggleMilestone(goalId, milestoneId) {
            if (currentRole === 'mentor') return; // Students complete their own milestones

            const goal = goals.find(g => g.id === goalId);
            if (goal) {
                const milestone = goal.milestones.find(m => m.id === milestoneId);
                if (milestone) {
                    milestone.completed = !milestone.completed;
                    
                    // Trigger streak award toast if completed
                    if (milestone.completed) {
                        window.toast.success("Milestone Completed!", "Great progress! +10 XP awarded.");
                    }
                    renderGoalsList();
                }
            }
        }

        function addInlineMilestone(goalId) {
            const input = document.getElementById(`inlineNewM-${goalId}`);
            const text = input.value.trim();
            if (text === '') return;

            const goal = goals.find(g => g.id === goalId);
            if (goal) {
                goal.milestones.push({
                    id: `m-${Date.now()}`,
                    text,
                    completed: false
                });
                input.value = '';
                renderGoalsList();
                window.toast.success("Milestone Added");
            }
        }

        function quickAddSuggestedMilestone(text) {
            if (goals.length > 0) {
                goals[0].milestones.push({
                    id: `m-${Date.now()}`,
                    text,
                    completed: false
                });
                renderGoalsList();
                window.toast.success("Suggested Milestone Added", `Added target check-off: "${text}"`);
            } else {
                window.toast.warning("Create Goal First", "Please add a target goal before appending milestones.");
            }
        }
    </script>
    <script src="/navigation-loader.js"></script>
</body>
</html>
